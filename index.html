<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
      <!-- Header -->

    <div class="calculator-header">

            <h1>CALCULATOR</h1>
           <!-- History Button -->

    <button id="historyButton" class="history-button">
             ↶
        </button>

</div>

    <!-- DISPLAY -->

    <div class="display">

      <input  type="text" id="display" value="0" readonly>
   
    </div>

 <!--  CALCULATOR BUTTONS -->

   <div class="buttons">

         <!-- Row 1 -->

         <button class="normal" data-value="("> ( </button>
         <button class="normal" data-value=")"> ) </button>
         <button class="clear" id="clear"> C </button>
         <button class="normal" data-value="%"> % </button>

         <!-- Row 2 -->

         <button class="normal" data-value="7"> 7 </button>
         <button class="normal" data-value="8"> 8 </button>
         <button class="normal" data-value="9"> 9 </button>
         <button class="operator" data-value="×"> × </button>
  
    <!-- Row 3 -->
         <button class="normal" data-value="4"> 4 </button>
         <button class="normal" data-value="5"> 5 </button>
         <button class="normal" data-value="6"> 6 </button>
         <button class="operator" data-value="−"> − </button>

      <!-- Row 4 -->

        <button class="normal" data-value="1"> 1 </button>
        <button class="normal" data-value="2"> 2 </button>
        <button class="normal" data-value="3"> 3 </button>
        <button class="operator" data-value="+"> + </button>

    <!-- Row 5 -->
     
        <button class="normal" data-value="0"> 0 </button>
        <button class="normal" data-value="."> . </button>
        <button class="operator" data-value="÷"> ÷ </button>
        <button class="equal" id="equal"> = </button>

    </div>



 <!--  FOOTER -->

     <footer>

        Created by gs .

     </footer>


 </div>



    <!-- FULL SCREEN HISTORY PAGE  -->

    <div
        id="historyPanel"
        class="history-panel">

 <!-- Close History Button -->

    <button id="closeHistory" class="close-history"> × </button>

<!-- White History Box -->

    <div class="history-box">

         <div  id="historyList" class="history-list">

                <p class="empty-history">
                     No calculations yet
               </p>

            </div>


        </div>

        <!-- History Footer -->

        <footer class="history-footer">

            Created by gs.

        </footer>


    </div>



    <script src="script.js"></script>


</body>
</html>
